<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d334a"><link rel="manifest" href="/manifest.json"><title>ভেন্ডর ম্যানেজার — চারু</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#edf3f8;color:#19344c}header{background:linear-gradient(120deg,#06223c,#126274);color:white;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header img{width:64px;height:64px;object-fit:cover;border-radius:16px}header h1{margin:0;font-size:clamp(25px,4vw,40px)}header small{font-size:15px;color:#ffd28c}button{background:#086b88;color:white;border:0;border-radius:11px;padding:11px 16px;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.1)}button.secondary{background:#e4eef4;color:#174158}button.danger{background:#b83e4c}button.gold{background:#dc9430;color:#182e3d}input,select{padding:11px;border:1px solid #c6d6df;border-radius:9px;min-width:0;width:100%;font:inherit}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}main{max-width:1400px;margin:22px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 6px 28px #163b5512;margin-bottom:16px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.nav button{white-space:nowrap}.nav button.active{background:#db932b;color:#152f41}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}.field{min-width:0}.stats{font-size:29px;font-weight:800;color:#0c647e}.muted{color:#678092}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;white-space:nowrap}th{background:#e9f3f6}td button{padding:6px 9px;font-size:12px;margin:2px}#auth{max-width:460px;margin:45px auto}#app{display:none}.hide{display:none!important}.pill{background:#e7f5f7;padding:5px 10px;border-radius:20px}#notice{position:fixed;bottom:20px;right:15px;background:#183c52;color:white;padding:14px;border-radius:12px;display:none;z-index:10;max-width:90vw}@media print{header,.nav,.no-print,button,#notice{display:none!important}body{background:white}.panel{box-shadow:none}main{margin:0}.tablewrap{overflow:visible}table{font-size:10px}td,th{white-space:normal;padding:5px}}
</style></head><body><header><img src="/static/logo.png" alt="চারু লোগো"><div><h1 id="brand">ভেন্ডর ম্যানেজার</h1><small>চারু</small></div><div style="margin-left:auto" class="flex"><button class="secondary" onclick="toggleLang()" id="lang">English</button><button class="gold" onclick="installApp()" id="install">ইনস্টল</button><span id="who"></span><button class="secondary hide" id="logout" onclick="logout()">Logout</button></div></header><div id="notice"></div>
<section id="auth" class="panel"><h2 id="authTitle">লগইন / রেজিস্ট্রেশন</h2><div class="flex"><button onclick="authMode='login';renderAuth()">লগইন</button><button class="secondary" onclick="authMode='register';renderAuth()">রেজিস্ট্রেশন</button></div><form id="authForm" onsubmit="submitAuth(event)"><div id="nameField" class="field hide"><label>নাম / Name</label><input name="name"></div><div class="field"><label>ইউজারনেম / Username</label><input name="username" required minlength="3"></div><div class="field"><label>পাসওয়ার্ড / Password (8+)</label><input type="password" name="password" required></div><p><button type="submit" id="authSubmit">লগইন করুন</button></p></form><p class="muted">প্রথম রেজিস্ট্রেশনকারী অ্যাডমিন। অন্যদের অ্যাডমিন অনুমোদন প্রয়োজন।</p></section>
<main id="app"><nav class="nav no-print" id="tabs"></nav><div id="content"></div></main>
<script>
let data={},me={},page='dashboard',lang='bn',authMode='login',edit={},deferredInstall=null;const months=['','জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],enmonths=['','January','February','March','April','May','June','July','August','September','October','November','December'];const names={dashboard:['ড্যাশবোর্ড','Dashboard'],vendors:['ভেন্ডর তালিকা','Vendors'],payments:['মাসিক পেমেন্ট','Monthly payments'],banks:['ব্যাংক','Banks'],heads:['খাত / হেড','Heads'],users:['অনুমোদন','Approvals'],settings:['প্রতিষ্ঠান','Organization'],report:['ব্যাংক PDF','Bank PDF'],contact:['যোগাযোগ করুন','Contact']};const tr=(a,b)=>lang==='bn'?a:b,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(s){let n=document.getElementById('notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',3500)}async function api(url,method='GET',body){let r=await fetch('/api/'+url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}function renderAuth(){document.getElementById('nameField').classList.toggle('hide',authMode!=='register');document.getElementById('authSubmit').textContent=authMode==='login'?'লগইন করুন':'রেজিস্ট্রেশন করুন'}async function submitAuth(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let r=await api(authMode,'POST',f);if(authMode==='login')await start();else{notify(r.message);authMode='login';renderAuth()}}catch(e){notify(e.message)}}async function start(){me=await api('me');if(!me.name){document.getElementById('auth').style.display='block';return}document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';document.getElementById('logout').classList.remove('hide');document.getElementById('who').textContent=me.name;await refresh()}async function refresh(){data=await api('data');render()}async function logout(){await api('logout','POST');location.reload()}function toggleLang(){lang=lang==='bn'?'en':'bn';document.getElementById('lang').textContent=lang==='bn'?'English':'বাংলা';document.getElementById('brand').textContent=tr('ভেন্ডর ম্যানেজার','Vendor Manager');render()}function go(p){page=p;edit={};render()}function render(){let tabs=Object.keys(names).filter(k=>k!=='users'||me.role==='admin');document.getElementById('tabs').innerHTML=tabs.map(k=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${names[k][lang==='bn'?0:1]}</button>`).join('');document.getElementById('content').innerHTML=({dashboard:dashboard,vendors:()=>listing('vendors'),payments:payments,banks:()=>listing('banks'),heads:()=>listing('heads'),users:users,settings:settings,report:report,contact:contact}[page]||dashboard)()}
function dashboard(){let sum=data.payments.reduce((a,p)=>a+Number(p.amount||0),0);return `<div class="grid">${[[tr('মোট ভেন্ডর','Vendors'),data.vendors.length],[tr('পেমেন্ট রেকর্ড','Payments'),data.payments.length],[tr('ব্যাংক','Banks'),data.banks.length],[tr('সর্বমোট পেমেন্ট (৳)','All payments (৳)'),sum.toLocaleString()]].map(x=>`<div class="panel"><div class="muted">${x[0]}</div><div class="stats">${x[1]}</div></div>`).join('')}</div><div class="panel"><h2>${tr('দ্রুত কাজ শুরু করুন','Quick start')}</h2><div class="flex"><button onclick="go('vendors')">${tr('ভেন্ডর যোগ করুন','Add vendor')}</button><button onclick="go('payments')">${tr('পেমেন্ট এন্ট্রি','Enter payment')}</button><button onclick="go('report')">${tr('PDF তৈরি','Create PDF')}</button></div></div>`}
const vf=['name','holder','account','routing','branch','bank','mobile','head'],labels={name:'Vendor name / ভেন্ডর',holder:'Account holder / হিসাবের নাম',account:'Account no / হিসাব নম্বর',routing:'Routing / রাউটিং',branch:'Branch / শাখা',bank:'Bank / ব্যাংক',mobile:'Mobile / মোবাইল',head:'Head / খাত'};function field(k,v=''){let opts=k==='bank'?data.banks.map(x=>x.name):k==='head'?data.heads.map(x=>x.name):null;return `<div class="field"><label>${labels[k]||k}</label>${opts?`<select name="${k}"><option value="">--</option>${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${k}" value="${esc(v)}" ${k==='name'?'required':''}>`}</div>`}function listing(kind){let isv=kind==='vendors',items=data[kind],record=edit[kind]||{},cols=isv?vf:['name'];return `<section class="panel no-print"><h2>${names[kind][lang==='bn'?0:1]}</h2><form onsubmit="saveForm(event,'${kind}')"><input type="hidden" name="id" value="${record.id||''}"><div class="grid">${cols.map(k=>field(k,record[k])).join('')}</div><p><button>${record.id?tr('আপডেট করুন','Update'):tr('নতুন যোগ করুন','Add new')}</button> <button type="button" class="secondary" onclick="edit={};render()">${tr('বাতিল','Cancel')}</button></p></form></section><section class="panel"><div class="flex"><h3>${tr('সংরক্ষিত তালিকা','Saved records')} (${items.length})</h3><input style="max-width:300px" placeholder="Search / খুঁজুন" oninput="filterRows(this.value)"></div><div class="tablewrap"><table><thead><tr>${cols.map(k=>`<th>${labels[k]||k}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="rows">${items.map(x=>`<tr>${cols.map(k=>`<td>${esc(x[k])}</td>`).join('')}<td><button onclick="editRow('${kind}',${x.id})">${tr('বিস্তারিত / এডিট','Details / Edit')}</button><button class="danger" onclick="del('${kind}',${x.id})">${tr('মুছুন','Delete')}</button></td></tr>`).join('')}</tbody></table></div></section>`}function filterRows(q){document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}function editRow(kind,id){edit[kind]=data[kind].find(x=>x.id===id);render();window.scrollTo(0,0)}async function saveForm(e,kind){e.preventDefault();try{await api('save/'+kind,'POST',Object.fromEntries(new FormData(e.target)));edit={};await refresh();notify(tr('সেভ হয়েছে','Saved'))}catch(e){notify(e.message)}}async function del(kind,id){if(!confirm(tr('নিশ্চিতভাবে মুছবেন?','Delete this record?')))return;try{await api('delete/'+kind+'/'+id,'POST');await refresh()}catch(e){notify(e.message)}}
function payments(){let yr=window.selectedYear||2026,mo=window.selectedMonth||1,bank=window.selectedBank||'';let rows=data.payments.filter(p=>p.year==yr&&p.month==mo).map(p=>({...p,v:data.vendors.find(v=>v.id===p.vendor_id)||{}})).filter(p=>!bank||p.v.bank===bank);return `<section class="panel no-print"><h2>${tr('মাসিক পেমেন্ট','Monthly payments')}</h2><div class="grid"><div><label>Year / বছর</label><input type="number" value="${yr}" onchange="selectedYear=+this.value;render()"></div><div><label>Month / মাস</label><select onchange="selectedMonth=+this.value;render()">${months.slice(1).map((m,i)=>`<option value="${i+1}" ${mo===i+1?'selected':''}>${lang==='bn'?m:enmonths[i+1]}</option>`).join('')}</select></div><div><label>Bank / ব্যাংক</label><select onchange="selectedBank=this.value;render()"><option value="">${tr('সব ব্যাংক','All banks')}</option>${data.banks.map(b=>`<option ${bank===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div></div><h3>${tr('পেমেন্ট যোগ / পরিবর্তন','Add / edit payment')}</h3><form onsubmit="saveForm(event,'payments')"><input type="hidden" name="id" value="${edit.payments?.id||''}"><div class="grid"><div><label>Vendor / ভেন্ডর</label><select name="vendor_id" required>${data.vendors.map(v=>`<option value="${v.id}" ${edit.payments?.vendor_id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div><label>Year</label><input name="year" type="number" value="${edit.payments?.year||yr}"></div><div><label>Month</label><select name="month">${months.slice(1).map((m,i)=>`<option value="${i+1}" ${(edit.payments?.month||mo)===i+1?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Amount (৳)</label><input name="amount" type="number" step="0.01" min="0" value="${edit.payments?.amount||''}" required></div>${field('head',edit.payments?.head||'General')}</div><p><button>${tr('পেমেন্ট সেভ','Save payment')}</button></p></form></section><section class="panel"><h3>${tr('মাসিক তালিকা','Monthly list')} — ${rows.length} | ৳ ${rows.reduce((a,p)=>a+p.amount,0).toLocaleString()}</h3><div class="tablewrap"><table><tr><th>Vendor</th><th>Bank</th><th>Head</th><th>Amount ৳</th><th>Actions</th></tr>${rows.map(p=>`<tr><td>${esc(p.v.name)}</td><td>${esc(p.v.bank)}</td><td>${esc(p.head)}</td><td>${Number(p.amount).toLocaleString()}</td><td><button onclick="editRow('payments',${p.id})">Edit</button><button class="danger" onclick="del('payments',${p.id})">Delete</button></td></tr>`).join('')}</table></div></section>`}
function users(){return `<section class="panel"><h2>${tr('ব্যবহারকারী অনুমোদন','User approvals')}</h2><table>${data.users.map(u=>`<tr><td>${esc(u.name)} (${esc(u.username)})</td><td>${esc(u.role)}</td><td>${u.approved?tr('অনুমোদিত','Approved'):`<button onclick="approve(${u.id})">${tr('অনুমোদন দিন','Approve')}</button>`}</td></tr>`).join('')}</table></section>`}async function approve(id){await api('approve/'+id,'POST');await refresh()}
function setting(k){return data.settings.find(x=>x.key===k)?.value||''}function settings(){return `<section class="panel"><h2>${tr('প্রতিষ্ঠানের তথ্য','Organization')}</h2><form onsubmit="saveSettings(event)"><div class="grid"><div><label>Organization / প্রতিষ্ঠানের নাম</label><input name="organization" value="${esc(setting('organization'))}"></div><div><label>Address / ঠিকানা</label><input name="address" value="${esc(setting('address'))}"></div></div><p><button>Save / সেভ</button></p></form></section>`}async function saveSettings(e){e.preventDefault();for(let [key,value] of new FormData(e.target))await api('save/settings','POST',{key,value});await refresh();notify('Saved')}
function report(){let yr=window.reportYear||2026,mo=window.reportMonth||1,bank=window.reportBank||'',rows=data.payments.filter(p=>p.year===yr&&p.month===mo).map(p=>({...p,v:data.vendors.find(v=>v.id===p.vendor_id)||{}})).filter(p=>!bank||p.v.bank===bank);return `<section class="panel no-print"><h2>${tr('ব্যাংক পেমেন্ট PDF','Bank payment PDF')}</h2><div class="grid"><div><label>Year</label><input type="number" value="${yr}" onchange="reportYear=+this.value;render()"></div><div><label>Month</label><select onchange="reportMonth=+this.value;render()">${months.slice(1).map((m,i)=>`<option value="${i+1}" ${mo===i+1?'selected':''}>${lang==='bn'?m:enmonths[i+1]}</option>`).join('')}</select></div><div><label>Bank</label><select onchange="reportBank=this.value;render()"><option value="">All banks</option>${data.banks.map(b=>`<option ${bank===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div></div><p><button onclick="window.print()">${tr('PDF দেখুন / সংরক্ষণ করুন','Print / Save as PDF')}</button></p><p class="muted">${tr('প্রিন্ট অপশনে Save as PDF নির্বাচন করুন।','Choose Save as PDF in your print dialog.')}</p></section><section class="panel"><h2 style="text-align:center">${esc(setting('organization')||tr('প্রতিষ্ঠানের নাম','Organization name'))}</h2><p style="text-align:center">${esc(setting('address'))}</p><h3 style="text-align:center">${tr('ব্যাংক পেমেন্ট বিবরণী','Bank Payment Statement')} — ${lang==='bn'?months[mo]:enmonths[mo]} ${yr}</h3><p>${tr('ব্যাংক','Bank')}: ${esc(bank||tr('সব ব্যাংক','All banks'))}</p><div class="tablewrap"><table><tr><th>#</th><th>Bank</th><th>Account Holder</th><th>Account No.</th><th>Routing</th><th>Branch</th><th>Vendor</th><th>Amount ৳</th></tr>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.v.bank)}</td><td>${esc(p.v.holder)}</td><td>${esc(p.v.account)}</td><td>${esc(p.v.routing)}</td><td>${esc(p.v.branch)}</td><td>${esc(p.v.name)}</td><td>${Number(p.amount).toLocaleString()}</td></tr>`).join('')}<tr><th colspan="7">${tr('মোট','Total')}</th><th>৳ ${rows.reduce((a,p)=>a+Number(p.amount),0).toLocaleString()}</th></tr></table></div></section>`}
function contact(){return `<section class="panel"><h2>${tr('যোগাযোগ করুন','Contact')}</h2><p><b>এস এম মফিজুর রহমান</b></p><p><a href="tel:01816883385">০১৮১৬৮৮৩৩৮৫</a></p><p>নয়াহাট, পটিয়া, চট্টগ্রাম।</p></section>`}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});async function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else notify('Browser menu → Install app / Add to Home Screen (HTTPS required)')}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');start().catch(()=>{});
</script></body></html>
